version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ai_code_reviewer_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_code_reviewer_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: super-secret-jwt-key-for-dev-environment-123456
      JWT_EXPIRES_IN: 7d
      AI_PROVIDER: mock
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
